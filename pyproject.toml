[project]
name = "taxadvisor"
version = "0.1.0"
description = "Personal Slovak tax advisor (s.r.o.) – chat + voice UI on top of Claude Code headless (claude -p), with law sync and changelog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0"]

[project.scripts]
taxadvisor = "taxadvisor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taxadvisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
